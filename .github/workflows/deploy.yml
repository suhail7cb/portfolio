name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Private Portfolio Data
        env:
          PORTFOLIO_CONFIG_BASE64: ${{ secrets.PORTFOLIO_CONFIG_BASE64 }}
        run: |
          mkdir -p assets/config
          if [ -n "$PORTFOLIO_CONFIG_BASE64" ]; then
            echo "Injecting portfolio configuration from GitHub secret..."
            echo "$PORTFOLIO_CONFIG_BASE64" | base64 --decode > assets/config/portfolio.json
          elif [ ! -f assets/config/portfolio.json ]; then
            echo "PORTFOLIO_CONFIG_BASE64 secret not found, falling back to sample template..."
            cp assets/config/portfolio.sample.json assets/config/portfolio.json
          else
            echo "Using existing repository configuration."
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release --base-href "/portfolio/"

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
