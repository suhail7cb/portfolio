  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0D14;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-indicator {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #00E5FF;
      background: #0A0D14;
      transition: opacity 0.3s ease-out;
      user-select: none;
    }
    .avatar-loader-container {
      position: relative;
      width: 88px;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .avatar-spinner {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-radius: 50%;
      border-top-color: #00E5FF;
      border-right-color: rgba(0, 229, 255, 0.6);
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      box-shadow: 0 0 18px rgba(0, 229, 255, 0.25);
    }
    .avatar-img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(0, 229, 255, 0.4);
      background-color: #111827;
      animation: pulse-glow 2s ease-in-out infinite alternate;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-glow {
      0% { box-shadow: 0 0 8px rgba(0, 229, 255, 0.2); }
      100% { box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="avatar-loader-container">
      <div class="avatar-spinner"></div>
      <img src="profile_1.jpeg" alt="Suhail Shabir" class="avatar-img" onerror="this.src='assets/assets/images/profile_1.jpeg';">
    </div>
    <p style="margin-top: 20px; font-size: 14px; font-weight: 500; letter-spacing: 0.5px; color: #94A3B8;">Loading Suhail Shabir Portfolio...</p>
  </div>
  <script>
    function removeLoader() {
      var el = document.getElementById('loading-indicator');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() {
          if (el && el.parentNode) {
            el.parentNode.removeChild(el);
          }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', removeLoader);
    setTimeout(removeLoader, 3500);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
